name: CI

# Policy: .github/CI.md

on:
  pull_request:
    branches:
      - develop
      - "dev-v*"
      - main
  push:
    branches:
      - develop
      - "dev-v*"
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: read
  pull-requests: read

jobs:
  changes:
    name: detect package changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.set.outputs.go }}
      node: ${{ steps.set.outputs.node }}
      docs_only: ${{ steps.set.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'go/**'
            node:
              - 'node/**'
            docs:
              - 'docs/**'
              - '**.md'
              - 'LICENSE'
            workflow:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/CI.md'
              - '.github/act/**'
              - '.actrc'
              - 'Makefile'
              - 'docker/**'
              - '.devcontainer/**'
              - 'scripts/**'

      - name: Resolve outputs
        id: set
        run: |
          if [[ "${{ steps.filter.outputs.workflow }}" == "true" || "${{ steps.filter.outputs.go }}" == "true" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.filter.outputs.workflow }}" == "true" || "${{ steps.filter.outputs.node }}" == "true" ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.filter.outputs.go }}" != "true" && "${{ steps.filter.outputs.node }}" != "true" && "${{ steps.filter.outputs.workflow }}" != "true" && "${{ steps.filter.outputs.docs }}" == "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  lint-go:
    name: lint go/sscachian
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if ancestor already passed
        id: skip
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-skip-if-ancestor-passed.sh "lint go/sscachian" go/sscachian .github/workflows/ci.yml .github/scripts/ci-skip-if-ancestor-passed.sh

      - name: Setup Go
        if: steps.skip.outputs.hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/sscachian/go.sum

      - name: gofmt
        if: steps.skip.outputs.hit != 'true'
        run: |
          out="$(gofmt -l .)"
          if [[ -n "$out" ]]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        if: steps.skip.outputs.hit != 'true'
        run: go vet ./...

  test-go:
    name: test go/sscachian
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if ancestor already passed
        id: skip
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-skip-if-ancestor-passed.sh "test go/sscachian" go/sscachian .github/workflows/ci.yml .github/scripts/ci-skip-if-ancestor-passed.sh

      - name: Setup Go
        if: steps.skip.outputs.hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/sscachian/go.sum

      - name: Setup Java (Firestore emulator)
        if: steps.skip.outputs.hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start Firestore Emulator
        if: steps.skip.outputs.hit != 'true'
        working-directory: ${{ github.workspace }}
        run: bash scripts/start-firestore-emulator.sh

      - name: go test
        if: steps.skip.outputs.hit != 'true'
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: go test ./...

  lint-node:
    name: lint node/sscachian
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/sscachian/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  test-node:
    name: test node/sscachian
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/sscachian/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start Firestore Emulator
        working-directory: ${{ github.workspace }}
        run: bash scripts/start-firestore-emulator.sh

      - name: Install
        run: npm ci

      - name: Test
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npm test

  ci-result:
    name: CI result
    needs:
      - changes
      - lint-go
      - test-go
      - lint-node
      - test-node
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          echo "go=${{ needs.changes.outputs.go }} node=${{ needs.changes.outputs.node }} docs_only=${{ needs.changes.outputs.docs_only }}"
          results=(
            "${{ needs.lint-go.result }}"
            "${{ needs.test-go.result }}"
            "${{ needs.lint-node.result }}"
            "${{ needs.test-node.result }}"
          )
          for r in "${results[@]}"; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "Required job finished as: $r"
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs are green (or skipped by path filter)."
