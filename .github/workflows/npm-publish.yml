name: npm publish

# Temporary path: push tag v* on main → npm publish @b4moss/ss-cachian
# Requires repository secret NPM_TOKEN (npm Granular Access Token with publish).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: publish @b4moss/ss-cachian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: node/sscachian/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set version from tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Unexpected tag: $tag"
            exit 1
          fi
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
