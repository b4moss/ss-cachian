name: npm publish

# Publishes @b4moss/ss-cachian via npm Trusted Publisher (OIDC).
# Do not set NODE_AUTH_TOKEN here — token auth would bypass Trusted Publisher.
# Org NPM_TOKEN may still exist for other repos' first-publish bootstrap.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to publish (e.g. 0.8.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish @b4moss/ss-cachian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node/sscachian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ver="${{ inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Unexpected version: $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: node/sscachian/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start Firestore Emulator
        working-directory: ${{ github.workspace }}
        run: bash scripts/start-firestore-emulator.sh

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npm test

      - name: Set package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish (Trusted Publisher / OIDC)
        # setup-node with registry-url may inject NODE_AUTH_TOKEN from org secrets;
        # that bypasses OIDC Trusted Publisher and often yields npm E404.
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --provenance
